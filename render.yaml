services:
  - type: web
    name: support-ticket-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
